<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Police Form Report</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Link to external CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="toast-container"></div>

    <div class="container">
        <header class="header">
            <h2>Police Duty Management System</h2>
            <p>Enter the details below to submit new postings.</p>
        </header>

        <main class="card">
            <form id="myForm">
                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" placeholder="Enter full name" required>
                </div>

                <div class="form-group">
                    <label for="pno">PNO</label>
                    <input type="number" id="pno" name="pno" max="999999999" placeholder="Enter PNO number" required>
                </div>

                <div class="form-group">
                    <label for="posting">Posting Police Station</label>
                    <div class="select-wrapper">
                        <select id="posting" name="posting" required>
                            <option value="" disabled selected>Select Police Station</option>
                            <option value="Kotwali Nagar">Kotwali Nagar</option>
                            <option value="Cantt">Cantt</option>
                            <option value="Mahila Thana">Mahila Thana</option>
                            <option value="Kotwali Ayodhya">Kotwali Ayodhya</option>
                            <option value="Kotwali Rudauli">Kotwali Rudauli</option>
                        </select>
                    </div>
                </div>

                <div class="button-group">
                    <button type="submit" class="btn btn-primary" id="btnSubmit">Submit</button>
                    <button type="reset" class="btn btn-outline" id="btnReset">Reset</button>
                    <button type="button" class="btn btn-info" id="btnDisplay">Display Report</button>
                </div>
            </form>
        </main>

        <section id="report-section" class="report-section hidden">
            <div class="report-header">
                <h3>Current Duty Details</h3>
            </div>
            <div id="report" class="report-container">
                <!-- Data will be populated here -->
            </div>
        </section>
    </div>

    <!-- Edit Modal -->
    <div id="editModal" class="modal hidden">
        <div class="modal-content card">
            <header class="modal-header">
                <h3>Edit Record</h3>
                <button class="close-btn" id="closeModal">&times;</button>
            </header>
            <form id="editForm">
                <input type="hidden" id="editOriginalPno" name="originalPno">

                <div class="form-group">
                    <label for="editName">Name</label>
                    <input type="text" id="editName" name="name" required>
                </div>

                <div class="form-group">
                    <label for="editPno">PNO</label>
                    <input type="number" id="editPno" name="pno" max="999999999" required>
                </div>

                <div class="form-group">
                    <label for="editPosting">Posting Police Station</label>
                    <div class="select-wrapper">
                        <select id="editPosting" name="posting" required>
                            <option value="" disabled>Select Police Station</option>
                            <option value="Kotwali Nagar">Kotwali Nagar</option>
                            <option value="Cantt">Cantt</option>
                            <option value="Mahila Thana">Mahila Thana</option>
                            <option value="Kotwali Ayodhya">Kotwali Ayodhya</option>
                            <option value="Kotwali Rudauli">Kotwali Rudauli</option>
                        </select>
                    </div>
                </div>

                <div class="button-group" style="margin-top: 1.5rem;">
                    <button type="submit" class="btn btn-primary" id="btnUpdateSubmit">Save Changes</button>
                    <button type="button" class="btn btn-outline" id="btnUpdateCancel">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Link to external JS -->
    <script src="script.js"></script>
</body>

</html>
